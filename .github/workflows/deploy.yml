name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (no actual upload)'
        required: false
        default: false
        type: boolean

# Two overlapping FTP deploys would interleave renames and the maintenance flag; queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: openssl, mbstring, ftp

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            php vendor/bin/deployment deployment.php --test
          else
            php vendor/bin/deployment deployment.php
          fi

      - name: Check the site responds
        if: ${{ inputs.test_mode != true }}
        run: |
          for path in / /enyaq /garden /losovani; do
            curl -fsS -o /dev/null --retry 3 --retry-delay 10 --retry-all-errors "https://spajxo.cz$path"
          done

      - name: Check the new revision is live
        if: ${{ inputs.test_mode != true }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://spajxo.cz/ | grep -qF "<meta name=\"revision\" content=\"$GITHUB_SHA\">"; then
              echo "Revision $GITHUB_SHA is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://spajxo.cz/ does not serve revision $GITHUB_SHA"
          exit 1
